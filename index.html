<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Basic Weather App" />
    <meta name="keywords" content="Weather, javascript, HTML, CSS" />
    <title>Weather App</title>

    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h2>Search Weather by Location</h2>
    <input type="text" id="locationInput" placeholder="Enter (City)" />
    <input type="text" id="locationInput" placeholder="Enter (State/Country)" />
    <button onclick="getWeather()">Get Weather</button>
    <p id="errorMessage" style="color: red"></p>
    <p id="successMessage" style="color: green"></p>

    <div id="weatherDisplay" class="weather" style="display: none">
      <h3 id="weatherLocation"></h3>
      <p id="temperature"></p>
      <p id="condition"></p>
    </div>

    <div id="forecastDisplay" class="forecast" style="display: none">
      <h3>5-Day Forecast</h3>
      <div id="forecastContainer"></div>
    </div>

    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
