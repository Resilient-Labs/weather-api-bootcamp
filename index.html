<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>World Weather</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/reset.css">
		<link rel="stylesheet" href="css/theme-default.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<main>
			<h1 class="shadow-box solid-shadow">
				<div>World Weather</div>
			</h1>
			<section class="search-panel">
				<div class="shadow-box solid-shadow">
					<input id="city" class="" type="text" placeholder="City"/>
				</div>
				<div class="shadow-box solid-shadow">
					<input id="country" class="" type="text" placeholder="Country (optional)"/>
				</div>
				<div class="shadow-box clickable line-shadow">
					<button>Search</button>
				</div>	
			</section>
			<section class="text-panel">
				<div class="shadow-box solid-shadow">
					<div class="content text-flow">
						<p id="error"></p>
						<p id="description">Select a location to check the weather!</p>
						<p id="temperature"></p>
					</div>
				</div>
			</section>
		</main>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
