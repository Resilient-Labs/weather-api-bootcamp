<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <img src="gif.gif" class="sun" alt="sun">
    <h1>Weather Checker</h1>
    <section>
        <input class="city" type="text" placeholder="Please Enter City"></input>
        <br>
        <input class="country" type="text" placeholder="Please Enter Country"></input>
        <br>
        <button class="submit">Submit</button>
    </section>

    <section>
        <h2>Temperature in Fahrenheit</h2>
        <div class="temperature"></div>
        <h2>Current Time</h2>
        <div class="time"></div>
    </section>
</body>
<script src="script.js"></script>

</html>
