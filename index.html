<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/weather.css">
    <title>Weather APP</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="images/icons8-weather-100.png" type="image/x-icon">

</head>

<body>
    <section>
        <h1 class="'orange">Weather APP</h1>
        <div>
            <input id="cityName" class="circle" type="text" placeholder="Enter City Name">
            <input id="countryName" class="circle" type="text" placeholder="Enter Country Name">
        </div>
        <button class="circle">Click</button>
        <section class="display">
            <img src="" alt="Image to represent weather">
            <div>
                <h2 class="'orange">Location</h2>
                <h3 class="'orange">Current Weather in Farenheit</h3>
            </div>
        </section>
    </section>
    <script src="JS/weather.js"></script>
</body>

</html>
