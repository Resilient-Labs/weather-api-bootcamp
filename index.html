<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="app-header fade-up">
        <h1>Breezy</h1>
        <p class="tagline">Weather Made Easy</p>
        <p id="today-date"></p>
    </header>

    <section id="weather-input">
        <label for="location-input"></label>
        <input id="location-input" type="text" placeholder="City,Country">
        <button id="search-btn" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" width="18"
                height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-4.35-4.35m1.35-6.65a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </button>
    </section>

    <section id="weather-data">
        <ul id="weather-cards"></ul>
    </section>


    <script src="js/main.js"></script>
</body>

</html>
