<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />	
		<title>Weather</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<header>
			<nav>
				<h3>PACHA WEATHER</h3>
				<p>GET TO KNOW WHAT IS WEATHER IN YOUR CITY</p>
			</nav>
		</header>
		<main>
			<section class="container">
				<h1>WEATHER LOOKUP</h1>
				<section class="container box">
					<input type="text" placeholder="City" value=""  id="city">
					<input type="text" placeholder="Country" value=""  id="input-country">
					<button type="button" name="button" id="search">SEARCH</button>
				</section>
			</section>
			<section class="weather-details">
				<h2 id="name"></h2>
				<h2 id="country"></h2>
				<section id="temperature">
                 	<img src="" alt="icon weather" id="temp-icon" >
					<h2 id="temp"></h2>
					<div class="switch"><div class="switch1">°F</div><div class="switch2">°C</div></div>
				</section>
				<h2 id="condition"></h2>
				<span class="details">WEATHER DETAILS</span>
				<section class="box-container">
					<section class="box"><div><span class="material-symbols-outlined">humidity_low</span><p>HUMIDITY</p></div><h2 id="dato1"></h2></section>
					<section class="box"><div><span class="material-symbols-outlined">air</span><p>WIND SPEED</p></div><h2 id="dato2"></h2></section>
					<section class="box"><div><span class="material-symbols-outlined">visibility</span><p>VISIBILITY</p></div><h2 id="dato3"></h2></section>
					<section class="box"><div><span class="material-symbols-outlined">thermometer</span><p>FEELS LIKE</p></div><h2 id="dato4"></h2></section>
				</section>
			</section>
		</main>
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
