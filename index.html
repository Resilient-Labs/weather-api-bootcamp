<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/weather-app.css">
    <title>Weather App AI</title>
</head>
<body>
<section id="webApp"></section>
    <h1> What's the Weather? </h1>
    <p> Enter your desired city or zipcode for the temperature and feel</p>

    <label for="cityInput"></label>
    <input type="search" id="cityInput" name="q" />
    <button>Search</button>


    <section>
        <img id="weatherIcon">
        <div id="condition"></div>
        <span>TEMP:</span><div id="temp"></div>
        <span>FEELS LIKE:</span><div id="feel"></div>
    </section>
</section>


<script type = "text/javascript" src = "js/weather-app.js"></script>
</body>
</html>
