<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>E-Ink Watch</title>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500" rel="stylesheet">

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		
		<main>
			<div class="watchBelt"></div>
			<div class="watch">
				<div class="date">
					<span class="day">MAR 25, 2025</span>
					<span class="time">12:30 PM</span>
				</div>	

				<div class="weather">
					<div class="left">
						<img src="img/location.png" alt="">
						<div>
							<span class="city">Boston</span>
							<a class="changeLocation">Change Location</a>
						</div>
					</div>
					<div class="right">
						<div>
							<div class="detail">
								<div class="feelsLike">
									<img src="img/thermometer.png" alt="">
									<span class="feelsLikeNumber">4°F</span>
								</div>

								<div class="wind">
									<img src="img/wind.png" alt="">
									<span class="windNumber">06:36 AM</span>
								</div>

								<div class="uv">
									<img src="img/uv.png" alt="">
									<span class="uvNumber">07:04 PM</span>
								</div>
							</div>
							<div class="temp">
								<span class="tempNumber">02</span>
								<span class="tempSign">°F</span>
							</div>
						</div>
						<span class="tempText">Partly cloudy</span>
					</div>
				</div>	


				<div class="bottom">
					<span class="day">Developed with ❤ </span>
					<span class="day">By Jorge Garcia-Zapata </span>
				</div>	
			</div>
			<div class="watchBelt"></div>
		</main>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
