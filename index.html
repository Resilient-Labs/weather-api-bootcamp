<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Weather Map</title>
</head>

<body>
    <h1>Weather App</h1>
    <main>
        <div>
            <h3>In the US</h3>
            <div class="input">
                <input type="text" name="city" id="city" placeholder="Enter a City">
                <input type="text" name="state" id="state" placeholder="Enter a State">
                <input type="text" name="country" id="country" placeholder="Enter a Country">
            </div>
            <button id="in-the-us">Get Weather</button>
        </div>

        <div>
            <h3>Outside the US</h3>
            <div class="input-1">
                <input type="text" name="city" id="city-2" placeholder="Enter a City">
                <input type="text" name="country" id="country-2" placeholder="Enter a Country">
            </div>

            <button id="out-the-us">Get Weather</button>
        </div>

    </main>

    <h2></h2>
    <h4></h4>
    <script type="text/javascript" src="assets/js/main.js"></script>
</body>
