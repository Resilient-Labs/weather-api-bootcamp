<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
</head>
<body>
  <h1>What's the Weather?</h1>
  <label>
    City: <input type="text" id="city" placeholder="Enter city" />
  </label>
  <br />
  <label>
    Country: <input type="text" id="country" placeholder="Enter country code (i.e., US)" />
  </label>
  <br />
  <button id="button">Check the weather</button>
  <p id="result"></p>

  <script src="js/main.js"></script>
</body>
</html>
